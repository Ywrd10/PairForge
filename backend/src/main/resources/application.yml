spring:
  application:
    name: pairforge-backend
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 5
      initialization-fail-timeout: -1
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 2
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 2s
    requested-heartbeat: 5s
    channel-rpc-timeout: 2s
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    cache:
      channel:
        size: 5
        checkout-timeout: 2s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

server:
  tomcat:
    connection-timeout: 5s
  forward-headers-strategy: none
  address: 127.0.0.1
  port: ${API_PORT:8080}

pairforge:
  auth:
    key-hex: ${JWT_KEY_HEX:}
    issuer: pairforge-api
    audience: pairforge-browser
    token-seconds: 900
    bcrypt-cost: 12
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    login-ip-limit: 20
    login-account-limit: 10
    registration-ip-limit: 5
    ip-window-seconds: 60
    account-window-seconds: 900
    registration-window-seconds: 3600

# Driver constraint messages can contain rejected row values. Error handling logs
# only exception types and request IDs instead.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    # Parser errors may include raw STOMP frames (tokens/source). Our handler logs
    # only the failure class and returns a constant protocol error.
    org.springframework.web.socket.messaging.StompSubProtocolHandler: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rabbit,redis
