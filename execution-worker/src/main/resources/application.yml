spring:
  application:
    name: pairforge-execution-worker
  flyway:
    enabled: false # Only the API owns schema migrations, including in worker tests.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 5
      initialization-fail-timeout: -1
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 2
  sql:
    init:
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 2s
    requested-heartbeat: 5s
    channel-rpc-timeout: 2s
    dynamic: false

server:
  address: 127.0.0.1
  port: ${WORKER_PORT:8081}

# Explicit sandbox profile/configuration is required. Enabling without a runner fails startup.
pairforge:
  worker:
    enabled: false
    previous-worker-stopped: false
    deadline-ms: 30000
    cleanup-timeout-ms: 2000
    retry-backoff-ms: 100

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rabbit,workerExecution
