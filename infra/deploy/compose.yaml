# Application host only. Keep this separate from the loopback-only development file.
name: pairforge-production
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pairforge
      POSTGRES_USER: pairforge_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/tls/server.crt, -c, ssl_key_file=/tls/server.key, -c, hba_file=/config/pg_hba.conf]
    ports:
      - "${DATA_PRIVATE_IP:?Set the application host private IPv4}:5432:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /etc/pairforge/secrets/postgres-password:/run/secrets/postgres-password:ro
      - /etc/pairforge/tls/postgres:/tls:ro
      - ./pg_hba.conf:/config/pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pairforge_bootstrap -d pairforge"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
  redis:
    image: redis:7.4.11-bookworm
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
  rabbitmq:
    image: rabbitmq:4.1.8
    hostname: pairforge-rabbitmq
    restart: unless-stopped
    ports:
      - "${DATA_PRIVATE_IP:?Set the application host private IPv4}:5671:5671"
      - "127.0.0.1:5671:5671"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - /etc/pairforge/tls/rabbitmq:/tls:ro
      - /etc/pairforge/secrets/rabbit-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
volumes:
  postgres-data:
  rabbitmq-data:
