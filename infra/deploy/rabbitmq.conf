listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /tls/ca.crt
ssl_options.certfile = /tls/server.crt
ssl_options.keyfile = /tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
# Server-authenticated TLS plus distinct password-authenticated API/worker users.
# No management plugin/port. Import hashes from the private definitions file.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
